# Create DB first:  CREATE DATABASE soulfeeder CHARACTER SET utf8mb4;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soulfeeder}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
# "update" is fine for a portfolio project. A real production system should use Flyway/Liquibase migrations + ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
