# Default: zero-setup H2 file DB so it runs immediately. For MySQL run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/soulfeeder;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# JWT signing key (>= 32 chars). The default is for LOCAL DEV ONLY - set JWT_SECRET in any real deployment.
app.jwt.secret=${JWT_SECRET}
app.jwt.hours=8
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.upload.dir=${UPLOAD_DIR:./uploads}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
