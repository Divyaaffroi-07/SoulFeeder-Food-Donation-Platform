services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: soulfeeder
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/soulfeeder
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes: [uploads:/uploads]
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:8080/api}" }
    depends_on: [backend]
    ports: ["8081:80"]
volumes: { dbdata: {}, uploads: {} }
